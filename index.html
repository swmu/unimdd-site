<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>unimdd · 应用与支持</title>
<meta name="description" content="unimdd 应用的支持与法务页面索引。">
<style>
  :root { color-scheme: light; --text: #1c1c1e; --muted: #6b6b70; --line: #e5e5ea; --soft: #f7f7f9; --accent: #4a6cf7; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #fff; color: var(--text);
    font: 17px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 720px; margin: 0 auto; padding: 44px 20px; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  .lede { color: var(--muted); margin: 0 0 28px; }
  .project {
    display: block; padding: 16px 18px; margin-bottom: 12px;
    background: var(--soft); border-radius: 12px;
    color: var(--text); text-decoration: none;
  }
  .project:hover { background: #f0f0f3; }
  .project strong { display: block; font-size: 17px; margin-bottom: 2px; }
  .project span { color: var(--muted); font-size: 15px; }
  footer { max-width: 720px; margin: 0 auto; padding: 0 20px 40px; color: var(--muted); font-size: 15px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>unimdd · 应用与支持</h1>
  <p class="lede">这里汇总 unimdd 旗下应用的支持与法务页面。每个应用一个独立目录。</p>

  <a class="project" href="ibeads/">
    <strong>爱拼豆会赢</strong>
    <span>拼豆图纸工具 · 支持与常见问题</span>
  </a>
  <!-- 新增项目时在此追加一项：
  <a class="project" href="<项目目录>/">
    <strong><应用名></strong>
    <span><一句话说明></span>
  </a>
  -->
</main>
<footer>
  <p>各应用的隐私政策与用户协议见其目录内页面。如需联系，请见对应应用的支持页。</p>
</footer>
</body>
</html>
